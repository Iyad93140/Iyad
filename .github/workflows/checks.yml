name: Tests
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s projects/stagetrack -p 'test_*.py' -v
      - run: python -m unittest discover -s projects/salesreport -p 'test_*.py' -v
      - run: python -m unittest discover -s projects/campus-library -p 'test_*.py' -v
      - run: node --test projects/focusboard/test_core.mjs
